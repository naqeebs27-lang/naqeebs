<section class="page-hero"><div class="wrap"><h1>Discount Calculator</h1><p>Work out the sale price and how much you save from an original price and a discount percentage.</p></div></section><section class="sec"><div class="wrap tool-wrap"><div class="tool tool-discount-calculator">
<div>
<div>
<div class="discount-calc">
  <h3>Discount Calculator</h3>
  <div class="input-row">
    <div class="field">
      <label for="origPrice">Original Price ($)</label>
      <input type="number" id="origPrice" value="100" min="0" oninput="calcDiscount()">
    </div>
    <div class="field">
      <label for="discountPct">Discount (%)</label>
      <input type="number" id="discountPct" value="15" min="0" max="100" oninput="calcDiscount()">
    </div>
  </div>
  <div class="results">
    <div class="res-line">
      <span>You Save:</span>
      <span>$<span id="savings">15.00</span></span>
    </div>
    <div class="res-line final-price">
      <span>Final Price:</span>
      <span>$<span id="finalPrice">85.00</span></span>
    </div>
  </div>
</div>
</div>
