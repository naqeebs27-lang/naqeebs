<a class="skip-link" href="#main">Skip to content</a>

<noscript><p class="wrap"><a href="../index.html">Home</a> · <a href="../services/">Services</a> · <a href="../pricing/">Pricing</a> · <a href="../portfolio/">Portfolio</a> · <a href="../contact-us/">Contact Us</a></p></noscript>
<main id="main">
<section class="page-hero"><div class="wrap"><h1>Bar Code 39</h1><p>Generate Code-39 barcodes and download them as PNG or JPEG.</p></div></section><section class="sec"><div class="wrap tool-wrap"><div class="tool tool-bar-code-39">
<div class="app-container">
  <div class="panel-left">
    <h2>Code-39 Full ASCII ℹ️</h2>
    <label>Data to Encode</label>
    <textarea id="barcodeData" oninput="generateBarcode()">Aa-1234</textarea>
  </div>
  <div class="panel-right">
    <div class="settings-header">
      <span style="font-size: 0.8rem; color: #999;">PREVIEW</span>
      <button class="btn settings-btn" onclick="toggleSettings()">⚙️ Settings</button>
    </div>
    <div class="barcode-display">
      <svg id="barcode"></svg>
    </div>
    <div id="settingsPanel" class="settings-overlay">
      <h3>Barcode Settings</h3>
      <label>Module Width</label>
      <input type="number" id="modWidth" value="2" step="0.5" oninput="generateBarcode()">
      <label>Image Resolution (DPI)</label>
      <select id="dpiSelect" onchange="generateBarcode()">
        <option value="96">96 DPI (Web)</option>
        <option value="150">150 DPI</option>
        <option value="300">300 DPI (Print)</option>
      </select>
      <label>Image Format</label>
      <select id="imgFormat">
        <option value="image/png">PNG</option>
        <option value="image/jpeg">JPEG</option>
      </select>
      <button class="btn close-btn" onclick="toggleSettings()">Done</button>
    </div>
    <button class="btn download-btn" onclick="downloadBarcode()">📥 Download Barcode</button>
  </div>
</div>
</div></div></section>
</main>
<div id="site-footer"></div>
</body>
</html>
