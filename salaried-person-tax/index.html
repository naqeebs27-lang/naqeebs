<main id="main">
<section class="page-hero"><div class="wrap"><h1>Salaried Person Tax</h1><p>Estimate monthly and annual income tax for salaried persons in Pakistan.</p></div></section><section class="sec"><div class="wrap tool-wrap"><div class="tool tool-salaried-person-tax">
<div class="container">
    <div class="card">
        <h3>Salaried Tax Calculator</h3>
        <div class="f-group">
            <label>Monthly Salary (PKR)</label>
            <input type="number" id="mIn" placeholder="Enter Monthly" oninput="sync()">
        </div>
        <div class="f-group">
            <label>Annual Salary (PKR)</label>
            <input type="number" id="aIn" placeholder="Total Annual">
        </div>
        <div class="f-group">
            <label>Tax Year</label>
            <select id="yr">
                <option value="2027">2026 – 2027</option>
                <option value="2026">2025 – 2026</option>
                <option value="2025">2024 – 2025</option>
                <option value="2024">2023 – 2024</option>
                <option value="2023">2022 – 2023</option>
                <option value="2022">2021 – 2022</option>
                <option value="2021">2020 – 2021</option>
                <option value="2020">2019 – 2020</option>
                <option value="2019">2018 – 2019</option>
                <option value="2018">2017 – 2018</option>
                <option value="2017">2016 – 2017</option>
                <option value="2016">2015 – 2016</option>
                <option value="2015">2014 – 2015</option>
            </select>
        </div>
        <button onclick="run()">Calculate</button>
        <div id="resBox">
            <span class="res-text">Monthly Tax:</span>
            <span class="res-amt" id="mOut"></span>
            <hr style="border:0; border-top:1px solid #c8e1ff; margin:8px 0;">
            <span class="res-text">Annual Tax:</span>
            <span class="res-amt" id="aOut"></span>
        </div>
    </div>
